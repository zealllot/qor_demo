# PRoctor configuration for qor_demo. Generated by /proctor-init walk.
#
# Stack: Go (GOPATH-era, no go.mod) + Postgres + qor admin on :8080.
# qor v1 reads its template path at runtime from $GOPATH; the build-and-run
# below uses go run from the repo root so the runtime GOPATH stays valid.
setup:
  # Initialize go.mod so deps resolve in CI's modules-only environment.
  - "test -f go.mod || go mod init github.com/zealllot/qor_demo"
  - "go mod tidy"
  # Bring up Postgres (matches docker-compose.yml ports + creds)
  - "docker compose -f docker-compose.yml up -d"
  - "for i in $(seq 1 30); do nc -z 127.0.0.1 9722 && break; sleep 1; done"
  # Build the binary first (more stable than `go run` for a long-running
  # process; `go run` execs a temp binary that can be cleaned up on the
  # parent shell exit).
  - "set -a; . ./env; set +a; go build -o /tmp/qor_demo_bin ."
  # qor/admin v1 reads its bundled HTML templates from
  # $GOPATH/src/github.com/qor/admin/views/ at runtime. With Go modules
  # those templates live under $GOPATH/pkg/mod/.../admin@<ver>/views,
  # so we symlink the modules path into the GOPATH source layout.
  # Without this, `/admin` panics on every request with a nil-template
  # html/template.Execute (see RegisterViewPathError at boot).
  - "ADMIN_MOD=$(ls -d $(go env GOPATH)/pkg/mod/github.com/qor/admin@v* 2>/dev/null | head -1); mkdir -p $(go env GOPATH)/src/github.com/qor; ln -sfn \"$ADMIN_MOD\" $(go env GOPATH)/src/github.com/qor/admin"
  # Start it via setsid so it detaches into its own session/process group
  # and survives any parent-shell teardown between stages.
  - "setsid /tmp/qor_demo_bin > /tmp/qor_demo.log 2>&1 < /dev/null &"
  # Wait for the admin endpoint. On timeout, dump the server log so the
  # next stage's failure is diagnosable from the action artifact alone.
  - "for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/admin >/dev/null 2>&1 && break; sleep 1; done || { echo '--- server failed to come up; /tmp/qor_demo.log ---'; tail -200 /tmp/qor_demo.log 2>/dev/null; exit 1; }"

base_url: "http://127.0.0.1:8080/admin"
test_focus: ["api", "frontend"]
require_approval: false
auto_fix: true
fix_pr_target_branch: "${PR_BRANCH}"
per_test_timeout_seconds: 60
mobile_emulator: false

# Visual regression off by default (adds ~30-90s/run); enable when
# you start changing visible admin UI.
visual_regression: false
